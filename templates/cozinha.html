<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="/static/favicon.ico">

    <title>Cozinha</title>

    <link href="/static/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="tela-escura">

<header class="topbar">
    <span class="topbar__brand">Cantina</span>
    <span class="topbar__pagina">Pedidos da Cozinha</span>
</header>

<div class="container py-4">

    <div class="text-center mb-4">

        <a href="/historico" class="btn btn-outline-secondary">

            Ver Histórico

        </a>

    </div>

    <div
        id="pedidos"
        class="row g-3"
    >

    </div>

</div>

<script>

let ws;

const pedidos = new Map();

const STATUS_MODIFICADOR = {

    AGUARDANDO: "aguardando",
    PREPARO: "preparo",
    PRONTO: "pronto"

};

function statusModificador(status) {

    return STATUS_MODIFICADOR[status] || "aguardando";

}

function statusBadge(status) {

    return `<span class="status-badge status-badge--${statusModificador(status)}">${status}</span>`;

}

function criarCard(pedido) {

    let itens = "";

    pedido.itens.forEach(function(item){

        let desc = "";

        if (item.descricao && item.descricao.trim() !== "") {

            desc = `<br><small class="text-muted">→ ${item.descricao}</small>`;

        }

        itens += `
            <li>
                ${item.quantidade}x ${item.produto}${desc}
            </li>
        `;

    });

    return `

    <div
        class="col-lg-4 col-md-6"
        id="pedido-${pedido.numero}"
    >

        <div class="card shadow h-100 pedido-card pedido-card--${statusModificador(pedido.status)}">

            <div class="card-body">

                <h3>

                    Pedido #${pedido.numero}

                </h3>

                <p>

                    <strong>Cliente:</strong>
                    ${pedido.cliente}

                </p>

                <p>

                    <strong>Hora:</strong>
                    ${pedido.hora}

                </p>

                <hr>

                <ul>

                    ${itens}

                </ul>

                ${pedido.observacao && pedido.observacao.trim() !== "" ? `
                <div class="observacao-cozinha">
                    <strong>Obs:</strong> ${pedido.observacao}
                </div>
                ` : ""}

                <hr>

                <p>

                    <strong>Status:</strong>

                    <span id="status-${pedido.numero}">

                        ${statusBadge(pedido.status)}

                    </span>

                </p>

                <div class="d-grid gap-2">

                    <button
                        class="btn btn-warning"
                        onclick="preparo(${pedido.numero})"
                    >

                        Iniciar preparo

                    </button>

                    <button
                        class="btn btn-success"
                        onclick="pronto(${pedido.numero})"
                    >

                        Pronto

                    </button>

                    <button
                        class="btn btn-secondary"
                        onclick="entregue(${pedido.numero})"
                    >

                        Entregue

                    </button>

                </div>

            </div>

        </div>

    </div>

    `;

}

function atualizarStatusNaTela(numero, status) {

    const spanStatus = document.getElementById("status-" + numero);

    if (spanStatus) {

        spanStatus.innerHTML = statusBadge(status);

    }

    const card = document.querySelector("#pedido-" + numero + " .pedido-card");

    if (card) {

        card.classList.remove(
            "pedido-card--aguardando",
            "pedido-card--preparo",
            "pedido-card--pronto"
        );

        card.classList.add("pedido-card--" + statusModificador(status));

    }

}

function desenharPedidos() {

    const container = document.getElementById("pedidos");

    container.innerHTML = "";

    pedidos.forEach(function(pedido) {

        container.innerHTML += criarCard(pedido);

    });

}


function preparo(numero) {

    ws.send(JSON.stringify({

        tipo: "preparo",

        numero: numero

    }));

}


function pronto(numero) {

    ws.send(JSON.stringify({

        tipo: "pronto",

        numero: numero

    }));

}


function entregue(numero) {

    ws.send(JSON.stringify({

        tipo: "entregue",

        numero: numero

    }));

}


function conectar() {

    ws = new WebSocket(
        "ws://" + window.location.host + "/ws"
    );

    ws.onmessage = function(event) {

        const mensagem = JSON.parse(event.data);

        switch (mensagem.tipo) {

            case "lista":

                pedidos.clear();

                mensagem.pedidos.forEach(function(pedido) {

                    pedidos.set(pedido.numero, pedido);

                });

                desenharPedidos();

                break;


            case "novo":

                pedidos.set(

                    mensagem.pedido.numero,

                    mensagem.pedido

                );

                desenharPedidos();

                break;


            case "preparo":

                if (pedidos.has(mensagem.numero)) {

                    pedidos.get(mensagem.numero).status = "PREPARO";

                    atualizarStatusNaTela(mensagem.numero, "PREPARO");

                }

                break;


            case "pronto":

                if (pedidos.has(mensagem.numero)) {

                    pedidos.get(mensagem.numero).status = "PRONTO";

                    atualizarStatusNaTela(mensagem.numero, "PRONTO");

                }

                break;


            case "entregue":

                pedidos.delete(mensagem.numero);

                desenharPedidos();

                break;

        }

    };

    ws.onclose = function() {

        setTimeout(conectar, 2000);

    };

}

conectar();

</script>

</body>

</html>
