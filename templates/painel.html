<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="/static/favicon.ico">

    <title>Painel de Pedidos</title>

    <link href="/static/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="painel">

<div class="container-fluid">

    <div class="text-center painel-cabecalho">

        <h1 class="display-3">

            PEDIDOS PRONTOS

        </h1>

        <div class="painel-linha"></div>

        <button
            id="btn-som"
            class="btn btn-outline-light btn-sm mt-3"
            onclick="ativarSom()"
        >
            🔊 Ativar som
        </button>

    </div>

    <div

        id="lista-prontos"

        class="row justify-content-center mt-5"

    >

    </div>

</div>


<script>

let ws;

const pedidos = new Map();

let somAtivado = false;

let audioCtx = null;

let audioBuffer = null;


function ativarSom() {

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    fetch("/static/sons/pronto.mp3")

        .then(function(resp) { return resp.arrayBuffer(); })

        .then(function(data) {

            return audioCtx.decodeAudioData(data);

        })

        .then(function(buffer) {

            audioBuffer = buffer;

            somAtivado = true;

            const btn = document.getElementById("btn-som");

            btn.innerText = "Som ativado ✓";

            btn.disabled = true;

            btn.classList.remove("btn-outline-light");

            btn.classList.add("btn-success");

        })

        .catch(function() {

            document.getElementById("btn-som").innerText = "Erro ao carregar som";

        });

}


function tocarSom() {

    if (!somAtivado || !audioCtx || !audioBuffer) {

        return;

    }

    if (audioCtx.state === "suspended") {

        audioCtx.resume();

    }

    const source = audioCtx.createBufferSource();

    source.buffer = audioBuffer;

    source.connect(audioCtx.destination);

    source.start(0);

}

function desenharPainel() {

    const lista = document.getElementById("lista-prontos");

    lista.innerHTML = "";

    const prontos = Array.from(pedidos.values()).filter(function(pedido) {

        return pedido.status === "PRONTO";

    });

    if (prontos.length === 0) {

        lista.innerHTML = `

            <div class="painel-vazio mt-5">
                Nenhum pedido pronto no momento.
            </div>

        `;

        return;

    }

    prontos.forEach(function(pedido) {

        lista.innerHTML += `

            <div class="col-4 mb-4">

                <div class="card shadow text-center">

                    <div class="card-body">

                        <h1 class="display-1">

                            ${pedido.numero}

                        </h1>

                        <h4 class="mt-2">

                            ${pedido.cliente}

                        </h4>

                    </div>

                </div>

            </div>

        `;

    });

}


function conectar() {

    ws = new WebSocket(
        "ws://" + window.location.host + "/ws"
    );

    ws.onmessage = function(event) {

        const mensagem = JSON.parse(event.data);

        switch (mensagem.tipo) {

            case "lista":

                pedidos.clear();

                mensagem.pedidos.forEach(function(pedido) {

                    pedidos.set(

                        pedido.numero,

                        pedido

                    );

                });

                desenharPainel();

                break;


            case "novo":

                pedidos.set(

                    mensagem.pedido.numero,

                    mensagem.pedido

                );

                desenharPainel();

                break;


            case "preparo":

                if (pedidos.has(mensagem.numero)) {

                    pedidos.get(mensagem.numero).status = "PREPARO";

                    desenharPainel();

                }

                break;


            case "pronto":

                if (pedidos.has(mensagem.numero)) {

                    pedidos.get(mensagem.numero).status = "PRONTO";

                    tocarSom();

                    desenharPainel();

                }

                break;


            case "entregue":

                pedidos.delete(mensagem.numero);

                desenharPainel();

                break;

        }

    };

    ws.onclose = function() {

        setTimeout(conectar, 2000);

    };

}

conectar();

</script>

</body>

</html>
