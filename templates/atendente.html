<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cantina - Atendente</title>

    <link href="/static/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<header class="topbar">
    <span class="topbar__brand">Cantina</span>
    <span class="topbar__pagina">Novo Pedido</span>
</header>

<div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 9999;">
    <div id="confirmacao" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body fs-5 fw-bold">
                Pedido enviado com sucesso!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div class="container py-4">

    <div class="card shadow">

        <div class="card-body">

            <div class="mb-4">

                <label class="form-label">

                    Nome do Cliente (Opcional)

                </label>

                <input
                    id="cliente"
                    type="text"
                    class="form-control"
                    placeholder="Ex.: João"
                >

                </input>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Observação (opcional)

                </label>

                <textarea
                    id="observacao"
                    class="form-control"
                    rows="2"
                    placeholder="Ex.: Sem cebola, carne bem passada..."
                ></textarea>

                <small class="text-muted">
                    Visível apenas para a cozinha
                </small>

            </div>

            <hr>

            <h4 class="mb-3">

                Produtos

            </h4>

            <div id="lista-produtos">

                {% for produto in produtos %}

                <div
                    id="linha-{{ produto }}"
                    class="row align-items-center mb-2 produto-linha"
                >

                    <div class="col-6">

                        <strong>{{ produto }}</strong>

                        <div class="produto-preco">

                            R$ {{ ("%.2f" % precos[produto]) | replace(".", ",") }}

                        </div>

                    </div>

                    <div class="col-6 text-end">

                        <button
                            class="btn btn-stepper btn-stepper--menos"
                            onclick="alterar('{{ produto }}', -1)"
                        >
                            −
                        </button>

                        <span
                            id="{{ produto }}"
                            class="produto-qtd"
                        >
                            0
                        </span>

                        <button
                            class="btn btn-stepper btn-stepper--mais"
                            onclick="alterar('{{ produto }}', 1)"
                        >
                            +
                        </button>

                    </div>

                </div>

                {% if produto in combos %}

                <div
                    id="desc-row-{{ produto }}"
                    class="row mb-2"
                    style="display: none;"
                >

                    <div class="col-6 offset-6">

                        <div class="btn-group btn-group-sm" role="group">

                            <button
                                type="button"
                                class="btn btn-outline-primary desc-btn"
                                data-produto="{{ produto }}"
                                data-valor="Suco"
                                onclick="escolherDesc('{{ produto }}', 'Suco', this)"
                            >
                                Suco
                            </button>

                            <button
                                type="button"
                                class="btn btn-outline-primary desc-btn"
                                data-produto="{{ produto }}"
                                data-valor="Refrigerante"
                                onclick="escolherDesc('{{ produto }}', 'Refrigerante', this)"
                            >
                                Refrigerante
                            </button>

                        </div>

                    </div>

                </div>

                {% endif %}

                {% endfor %}

            </div>

            <hr>

            <div class="pedido-total">

                <span>Total do pedido</span>

                <strong id="total-pedido">R$ 0,00</strong>

            </div>

            <button

                class="btn btn-primary btn-lg w-100"

                onclick="enviarPedido()"

            >

                Enviar Pedido

            </button>

        </div>

    </div>

</div>

<script>

let ws;

const combos = {{ combos | tojson }};

const precos = {{ precos | tojson }};

let pedido = {};

function formatarMoeda(valor) {

    return "R$ " + valor.toFixed(2).replace(".", ",");

}

function atualizarTotal() {

    let total = 0;

    for (let produto in pedido) {

        total += pedido[produto] * (precos[produto] || 0);

    }

    document.getElementById("total-pedido").innerText = formatarMoeda(total);

}

let descricoes = {};

function escolherDesc(produto, valor, btn) {

    descricoes[produto] = valor;

    const grupo = btn.parentElement;

    grupo.querySelectorAll(".desc-btn").forEach(function(b) {

        b.classList.remove("active");

        b.classList.remove("btn-primary");

        b.classList.add("btn-outline-primary");

    });

    btn.classList.add("active");

    btn.classList.remove("btn-outline-primary");

    btn.classList.add("btn-primary");

}

function alterar(produto, valor) {

    if (!(produto in pedido)) {

        pedido[produto] = 0;

    }

    pedido[produto] += valor;

    if (pedido[produto] < 0) {

        pedido[produto] = 0;

    }

    document.getElementById(produto).innerText = pedido[produto];

    const linha = document.getElementById("linha-" + produto);

    if (linha) {

        linha.classList.toggle("produto-linha--ativo", pedido[produto] > 0);

    }

    atualizarTotal();

    const descRow = document.getElementById("desc-row-" + produto);

    if (descRow) {

        descRow.style.display = pedido[produto] > 0 ? "" : "none";

    }

}


function enviarPedido() {

    let itens = [];

    for (let produto in pedido) {

        if (pedido[produto] > 0) {

            let descricao = "";

            if (combos.includes(produto) && descricoes[produto]) {

                descricao = descricoes[produto];

            }

            itens.push({

                produto: produto,

                quantidade: pedido[produto],

                descricao: descricao

            });

        }

    }

    if (itens.length === 0) {

        alert("Selecione pelo menos um produto.");

        return;

    }

    const cliente = document
        .getElementById("cliente")
        .value
        .trim();

    ws.send(JSON.stringify({

        tipo: "novo",

        cliente: cliente,

        itens: itens,

        observacao: document.getElementById("observacao").value.trim()

    }));

    limparFormulario();

    const toast = new bootstrap.Toast(
        document.getElementById("confirmacao")
    );
    toast.show();

}


function limparFormulario() {

    document.getElementById("cliente").value = "";

    document.getElementById("observacao").value = "";

    pedido = {};

    const spans = document.querySelectorAll("#lista-produtos span");

    spans.forEach(function(span) {

        span.innerText = "0";

    });

    document.querySelectorAll(".produto-linha--ativo").forEach(function(linha) {

        linha.classList.remove("produto-linha--ativo");

    });

    atualizarTotal();

    combos.forEach(function(combo) {

        const descRow = document.getElementById("desc-row-" + combo);

        if (descRow) {

            descRow.style.display = "none";

        }

        descRow.querySelectorAll(".desc-btn").forEach(function(b) {

            b.classList.remove("active");

            b.classList.remove("btn-primary");

            b.classList.add("btn-outline-primary");

        });

    });

    descricoes = {};

}


function conectar() {

    ws = new WebSocket(
        "ws://" + window.location.host + "/ws"
    );

    ws.onopen = function() {

        console.log("Conectado.");

    };

    ws.onclose = function() {

        setTimeout(conectar, 2000);

    };

    ws.onerror = function() {

        alert("Erro na conexão.");

    };

    ws.onmessage = function(event) {

        const msg = JSON.parse(event.data);

        if (msg.tipo === "limite") {

            alert("Limite de 300 pedidos atingido!");

        }

    };

}

conectar();

</script>

<script src="/static/bootstrap.bundle.min.js"></script>

</body>

</html>
